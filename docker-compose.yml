services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:16-alpine
    container_name: it-ticketing-postgres
    environment:
      POSTGRES_DB: it_ticketing
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis 消息队列
  redis:
    image: redis:7-alpine
    container_name: it-ticketing-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Django 后端
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: it-ticketing-backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    # 如果你想在容器里使用容器内的 /app 代码，而不是挂本地，可去掉 volumes 这一段
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      # 如果你在 settings.py 用 DATABASE_URL（例如 dj-database-url），这行就够了
      DATABASE_URL: postgresql://postgres:postgres123@postgres:5432/it_ticketing

      # 如果你按我之前建议的方式用 POSTGRES_* 环境变量，也可以用下面这些：
      POSTGRES_DB: it_ticketing
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"

      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      DJANGO_SETTINGS_MODULE: config.settings
      DEBUG: "True"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Celery Worker
  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: it-ticketing-celery
    command: celery -A config worker --loglevel=info --pool=solo
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql://postgres:postgres123@postgres:5432/it_ticketing
      POSTGRES_DB: it_ticketing
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"

      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      DJANGO_SETTINGS_MODULE: config.settings
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # React 前端（Nginx 提供静态文件）
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: it-ticketing-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

# ==================== 监控服务 Day 13 ====================
  
  # Prometheus - 指标收集
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped

  # Grafana - 可视化仪表板
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
    restart: unless-stopped
    depends_on:
      - prometheus

  # Node Exporter - 系统指标
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    ports:
      - "9100:9100"
    restart: unless-stopped

  # PostgreSQL Exporter - 数据库指标
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter
    ports:
      - "9187:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:postgres123@postgres:5432/it_ticketing?sslmode=disable"
    restart: unless-stopped
    depends_on:
      - postgres

  # Redis Exporter - Redis指标
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: redis-exporter
    ports:
      - "9121:9121"
    environment:
      REDIS_ADDR: "redis:6379"
    restart: unless-stopped
    depends_on:
      - redis
volumes:
  postgres_data:
  prometheus_data:    # 新增
  grafana_data:      
networks:
  default:
    name: it-ticketing-network

